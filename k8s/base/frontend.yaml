apiVersion: apps/v1
kind: Deployment
metadata:
  name: skillswap-frontend
  namespace: skillswap
  labels:
    app.kubernetes.io/name: skillswap-frontend
    app.kubernetes.io/component: ui
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: skillswap-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: skillswap-frontend
        app.kubernetes.io/component: ui
    spec:
      containers:
        - name: frontend
          image: ghcr.io/skillswap/frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: skillswap-frontend
  namespace: skillswap
  labels:
    app.kubernetes.io/name: skillswap-frontend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
  selector:
    app.kubernetes.io/name: skillswap-frontend

