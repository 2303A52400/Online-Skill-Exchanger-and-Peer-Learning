apiVersion: v1
kind: ConfigMap
metadata:
  name: skillswap-config
  namespace: skillswap
data:
  NODE_ENV: "production"
  PORT: "5000"
  REDIS_HOST: "redis-master.skillswap.svc.cluster.local"
  REDIS_PORT: "6379"
  CORS_ORIGIN: "https://skillswap.example.com"
  LOG_LEVEL: "info"
---
apiVersion: v1
kind: Secret
metadata:
  name: skillswap-secrets
  namespace: skillswap
type: Opaque
stringData:
  DATABASE_URL: "postgresql://skillswap_user:SuperSecureProductionPassword123!@postgres.skillswap.svc.cluster.local:5432/skillswap?schema=public&sslmode=require"
  REDIS_PASSWORD: "SuperSecureRedisPassword123!"
  JWT_SECRET: "018f3a9e-8c3b-724f-a49e-b9e7b233f20d-skillswap-jwt"

